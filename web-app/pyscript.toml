name = "Clinical Trials API Update"

# pyscript.toml

# Define the packages your Python scripts need to run
# Note: 'requests' and 'urllib3' are intentionally excluded as they are incompatible with PyScript
packages = [
    "pandas",
    "numpy",
    "scikit-learn",
    "tqdm"
]

# Fetch the industry normalization dataset from the parent directory
[[fetch]]
from = "../data"
to_folder = "data"
files = [
    "industry_norm_final.csv",
]

# Fetch all required local files and load them into the browser's virtual memory
[[fetch]]
files = [
    "./main.py",
    "./api_call.py",
    "./disease_filter.py",
    "./sponsor_norm.py",
    "./mesh_mapping.py",
    "./scoring.py",
    "./browser_download.py"
]
